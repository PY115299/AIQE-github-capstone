name: Playwright UI and API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Safe Playwright Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_UI_BASE_URL: https://github.com
      GITHUB_API_BASE_URL: https://api.github.com
      GITHUB_EXPECTED_LOGIN: ${{ vars.AIQE_GITHUB_EXPECTED_LOGIN }}
      GITHUB_TOKEN: ${{ secrets.AIQE_GITHUB_PAT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run safe UI and API tests
        run: >
          npx playwright test
          --project=ui
          --project=api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
